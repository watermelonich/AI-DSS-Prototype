apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-service
  labels:
    app: data
spec:
  replicas: 2
  selector:
    matchLabels:
      app: data
  template:
    metadata:
      labels:
        app: data
    spec:
      containers:
        - name: data
          image: my-registry/data-ser:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: data-service
spec:
  selector:
    app: data
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
