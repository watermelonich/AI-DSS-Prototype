apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: istio-services
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      istio: sidecar-injector
  endpoints:
  - port: http-monitoring
    interval: 15s
  namespaceSelector:
    matchNames:
    - istio-system
