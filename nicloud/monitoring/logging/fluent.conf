# monitoring/logging/fluent.conf

# Fluentd configuration to collect logs from various sources and forward them to Elasticsearch

<source>
  @type tail
  path /var/log/*.log
  pos_file /var/log/fluentd.pos
  tag system.*
  format multiline
  format_firstline /^(?<time>[^ ]* [^ ]*) (?<level>[^ ]*) (?<message>.*)$/
  time_format %Y-%m-%d %H:%M:%S
</source>

<match **>
  @type elasticsearch
  logstash_format true
  host elasticsearch.local
  port 9200
  index_name fluentd
  type_name _doc
</match>
