# monitoring/prometheus/prometheus.yml

# Prometheus configuration to scrape metrics from targets

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'application_metrics'
    static_configs:
      - targets: ['app:8080']
